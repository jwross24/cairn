name = "cairn_lean"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1f29011071772620f612bf5a06433775f06067b8"

[[lean_lib]]
name = "Grounding"
globs = ["Grounding.+"]

[[lean_lib]]
name = "Challenge"
globs = ["Challenge.+"]

[[lean_exe]]
name = "statement_hash"
root = "Cairn.StatementHash"

[[lean_exe]]
name = "axioms"
root = "Cairn.Axioms"
