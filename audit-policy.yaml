# Project overrides for the beads compliance audit. The skill is vendored and not
# ours; this file is the supported way to tune it, so upstream updates keep
# arriving. scripts/_load-policy.sh resolves it with precedence
# hardcoded < this file < CLI flags, and bootstrap-audit.sh copies it into a new
# audit directory. Nothing here edits the skill.
#
# WHAT BINDS, and how each one gets there:
#
#   threshold, remediation_policy   read by _load-policy.sh, which reaches PyYAML
#                                   through `uv run --with pyyaml` because the
#                                   python3 on PATH is Homebrew's and has none.
#                                   A CLI --threshold still beats this file.
#   weights_by_type                 folded into beads_compliance_audit/rubric.md
#                                   frontmatter by sync-rubric-from-policy.py,
#                                   which bootstrap-audit.sh runs before pinning
#                                   rubric_sha256. score-bead.py reads the weights
#                                   from that frontmatter and nowhere else, so the
#                                   rubric is derived from this file rather than
#                                   maintained beside it.
#   subagents                       read only on the parallel path; the pre-commit
#                                   hook runs no subagents.
#
# WHAT BINDS NOTHING: project_theater_patterns. theater-scan.sh runs a fixed list
# of scan_pattern calls and reads no policy file. Measured 2026-08-26: the pattern
# below also does not match this repo's spelling, which puts the skipif arguments
# on the following line, so wiring it without fixing the signature would produce
# the appearance of a gate and no findings. cairn-fur owns both halves. The
# section stays because the pattern is the design work, not the plumbing.
#
# The five forked call sites in the skill are listed in CLAUDE.md. An upstream
# update reverts them, and this file goes back to binding only what a CLI flag
# carries.

# 700 stays until the waived phases actually run. On the pre-commit path,
# single-bead-audit.sh runs Phase 4 and Phase 6 in stub mode and awards the tests
# and test_depth weights below in full, so half of the 1000 says nothing about the
# bead. Raising a number over a stubbed measurement buys confidence, not
# assurance. The scorecard banner names both waived dimensions and calls the total
# an upper bound.
#
# The ordering the weights were meant to correct is still inverted, and weights
# cannot correct it. Measured 2026-08-26 with these weights binding: cairn-qn9, a
# cleanup with no tests of its own, scores 970; cairn-m0-e0s.12, with 108 tests,
# six metamorphic relations and six killed mutants, scores 875. The cause is
# extraction, not weighting, and it is stated below.
threshold: 700
remediation_policy: completion-debt

# THE SWITCH THAT COULD FAIL A FALSE CLOSE, AND WHY IT IS OFF.
#
# A dimension goes `n/a` when the deterministic extractor found no items of its
# kind, and `WAIVED` when its phase ran in stub mode. Both award full credit, so a
# bead the extractor cannot read scores full marks on every dimension it was never
# measured against. A fixture bead closed with the word "Done." and a body naming
# two files that do not exist scored 975 of 1000 and read Verified: 775 of it for
# having nothing to check. No threshold reaches that, because the score does not
# depend on the work, and no weighting does either -- any weighting of full credit
# for nothing is still full credit.
#
# `unmeasured_dimensions: excluded` drops an unmeasured dimension from the
# numerator and the denominator both; `minimum_measured_weight` refuses to score
# below a coverage floor, because a good score over a tiny measured base is not
# evidence and rescaling alone rewards the bead with the least to measure. Measured
# 2026-08-26 at excluded / 450 / 600, through the real single-bead audit, over all
# sixteen closed beads and a fresh false-closed fixture: the fixture reports
# UNVERIFIABLE and the pre-commit hook blocks the commit, while every M0
# implementation bead passes at 650 to 750. The gate works.
#
# THE MEASUREMENT THAT KEEPS IT OFF: cairn-cue, this file's own bead, scores 0 and
# reads UNVERIFIABLE under exactly that setting. Its dimensions are identical to
# the fixture's:
#
#                        cairn-cue          the "Done." fixture
#   Implementation       n/a 250/250        n/a 250/250
#   Required tests       WAIVED 300/300     WAIVED 300/300
#   Test depth           WAIVED 200/200     WAIVED 200/200
#   Docs                 n/a 25/25          n/a 25/25
#   measured weight      225                225
#
# A harness bead whose product is configuration and whose body is prose presents to
# the deterministic extractor exactly as a bead with nothing behind it, because the
# extractor cannot read prose. Any floor that fails the fixture fails honest work of
# that shape, and cairn-qn9 is the same case. The discriminator is not a threshold,
# a floor or a weighting; it is extraction, which is what
# subagents/bead-spec-extractor.md exists for and what the hook path deliberately
# does not run.
#
# So the switch stays off and stays tested. It becomes correct the moment the
# extractor runs on this path, and not before. cairn-exi owns that choice and
# blocks on cairn-cue.
unmeasured_dimensions: full_credit
minimum_measured_weight: 0

# What a Cairn bead is: a harness slice whose product is code plus the tests that
# prove it, closed with re-executed evidence. It ships no runbook, so the default
# 100 for docs measures something this project does not produce; and Mode A
# requires a close to name an open downstream bead for every No-Claim gap, so a
# heavy integration weight penalizes the discipline the project mandates.
#
# What this cannot fix, stated so nobody reads more into it: RUBRIC.md marks a
# dimension `n/a` and REDISTRIBUTES its weight when the spec extracts no items of
# that kind. A bead whose prose the deterministic parser cannot read therefore
# scores full marks on the dimensions it was never measured against. Weights move
# the shares between dimensions; they do not close that escape. Extraction does.
weights_by_type:
  task:
    implementation: 250
    tests: 300
    anti_theater: 200
    test_depth: 200
    docs: 25
    integration: 25

  bug:
    implementation: 200
    tests: 350
    anti_theater: 200
    test_depth: 200
    docs: 25
    integration: 25

# A skipped platform is a platform nobody is testing. cairn-hcl exists because the
# M0 write boundary is macOS-only and both write-boundary test files carry
# skipif(sys.platform != "darwin"), so the degraded behavior is asserted nowhere.
# A new platform skip in evidence is a claim that a gate ran when it did not.
project_theater_patterns:
  - id: P-platform-skip-hides-a-gate
    signature: 'skipif\(sys\.platform'
    file_glob: ['tests/**/*.py']
    in_test_files: true
    severity: MAJOR
    rationale: 'cairn-hcl: the write boundary degrades silently off macOS and the suite says so nowhere; a platform skip must be paired with an assertion naming the degraded behavior'

# Only meaningful on the parallel path; the pre-commit hook runs no subagents.
# spec-quality-reviewer is on because the measured failure is extraction, not
# scoring: Phase 2 warned "cairn-qn9 produced only 1 item(s) from a 2689-char body"
# and spec.json in fact held zero.
subagents:
  spec-quality-reviewer: pre_claim_only
  red-team-adversary: comprehensive_only
  security-auditor: false
  performance-auditor: false
  migration-safety-reviewer: false
  api-contract-checker: false
