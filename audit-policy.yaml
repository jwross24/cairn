# Project overrides for the beads compliance audit. The skill is vendored and not
# ours; this file is the supported way to tune it, so upstream updates keep
# arriving. scripts/_load-policy.sh resolves it with precedence
# hardcoded < this file < CLI flags, and bootstrap-audit.sh copies it into a new
# audit directory. Nothing here edits the skill.
#
# WHAT BINDS, and how each one gets there:
#
#   threshold, remediation_policy   read by _load-policy.sh, which reaches PyYAML
#                                   through `uv run --with pyyaml` because the
#                                   python3 on PATH is Homebrew's and has none.
#                                   A CLI --threshold still beats this file.
#   weights_by_type                 folded into beads_compliance_audit/rubric.md
#                                   frontmatter by sync-rubric-from-policy.py,
#                                   which bootstrap-audit.sh runs before pinning
#                                   rubric_sha256. score-bead.py reads the weights
#                                   from that frontmatter and nowhere else, so the
#                                   rubric is derived from this file rather than
#                                   maintained beside it.
#   subagents                       read only on the parallel path; the pre-commit
#                                   hook runs no subagents.
#
#   project_theater_patterns        read by scripts/theater_patterns.py, a
#                                   cairn-owned gate that scripts/check.sh runs
#                                   on the whole tree. The vendored skill reads
#                                   the section only from
#                                   subagents/theater-detector.md, and neither the
#                                   pre-commit path nor CI runs a subagent;
#                                   theater-scan.sh carries a fixed catalog and
#                                   opens no policy file. Findings gate the commit
#                                   and score nothing on the anti_theater
#                                   dimension.
#
# The five forked call sites in the skill are listed in CLAUDE.md. An upstream
# update reverts them, and this file goes back to binding only what a CLI flag
# carries.

# 700 stays until the waived phases actually run. On the pre-commit path,
# single-bead-audit.sh runs Phase 4 and Phase 6 in stub mode and awards the tests
# and test_depth weights below in full, so half of the 1000 says nothing about the
# bead. Raising a number over a stubbed measurement buys confidence, not
# assurance. The scorecard banner names both waived dimensions and calls the total
# an upper bound.
#
# The ordering weights alone could not correct is corrected by the switch below.
# Measured 2026-08-26 through the real single-bead audit: under
# `unmeasured_dimensions: full_credit`, cairn-qn9 -- a cleanup with no tests of its
# own -- scores 970 while cairn-m0-e0s.12, with 108 tests, six metamorphic relations
# and six killed mutants, scores 875. Under `excluded` the same two score 842 and
# 750, and cairn-qn9 no longer outranks the bead with a hundred more tests. The
# cause was extraction, not weighting, and it is stated below.
threshold: 700
remediation_policy: completion-debt

# THE SWITCH THAT FAILS A FALSE CLOSE, AND THE EXTRACTION IT RESTS ON.
#
# A dimension goes `n/a` when the deterministic extractor found no items of its
# kind, and `WAIVED` when its phase ran in stub mode. Under `full_credit` both
# award full marks, so a bead the extractor cannot read scores full marks on every
# dimension it was never measured against: a fixture closed with the word "Done."
# and a body naming two files that do not exist reaches 975 of 1000 and reads
# Verified, 775 of it for having nothing to check. No threshold reaches that,
# because the score does not depend on the work, and no weighting does either --
# any weighting of full credit for nothing is still full credit.
#
# `excluded` drops an unmeasured dimension from the numerator and the denominator
# both; `minimum_measured_weight` refuses to score below a coverage floor, because
# a good score over a tiny measured base is not evidence and rescaling alone
# rewards the bead with the least to measure.
#
# What makes that safe for honest work is `scripts/bead-artifact-block.sh`, which
# the pre-commit hook runs for every bead a commit closes. A closing bead's body
# carries an ARTIFACTS block naming its source and test files in backticks, its
# commit SHAs and the commands re-executed at close; the skill's unmodified
# PATH_HINT_RE extracts those paths, so the implementation dimension is measured
# rather than n/a. A harness bead whose product is configuration and whose body is
# prose is no longer indistinguishable from a bead with nothing behind it.
#
# Measured 2026-08-26 at excluded / 450, through the real single-bead audit:
#
#                        cairn-cue      cairn-qn9      the "Done." fixture
#   Implementation       175/250        175/250        n/a, excluded
#   Anti-theater         200/200        200/200        185/200
#   Cross-bead           0/25           25/25          15/25
#   measured weight      475            475            225
#   score                789            842            0, UNVERIFIABLE
#
# The floor of 450 sits below the 475 a configuration bead measures and the 500 a
# bead with docs measures, and above the 225 that is left when the implementation
# dimension is unmeasured. A bead whose body the extractor can read clears it; a
# bead whose body it cannot does not.
#
# THE COST OF THE SWITCH, MEASURED OVER EVERY CLOSED BEAD. Re-audited 2026-08-26 at
# excluded / 450, one single-bead pass each: seventeen of the eighteen closed M0
# beads pass at 750 to 780, and cairn-qn9 at 842. cairn-m0-e0s.16 reads 650 and
# FALSE-CLOSED on a BLOCKING anomaly finding that belongs to another bead:
# anomaly-scan.sh pattern 23 picks the newest commit whose message mentions the id,
# which for .16 is dcbe208, cairn-cue's commit, and counts `+.beads_hook.log` in
# .gitignore as a suppression. cairn-m0-e0s.12 read 650 on the same artifact at
# 21:50Z and 750 forty minutes later, unchanged, because two commits naming it had
# landed. cairn-fi7 owns that defect and carries the reproduction; the score it
# produces is not reproducible and no threshold here can compensate for that.
#
# What the switch itself costs, separated from that artifact: nothing measured so
# far. Every closed bead whose body the extractor can read clears 450 of measured
# weight and 700 of rescaled score.
#
# What this still does not measure: 500 of the 1000 is Phase 4 and Phase 6, both
# stubbed on the hook path and both excluded from the denominator. A passing score
# is a score over the half that was measured, and the scorecard banner says so.
unmeasured_dimensions: excluded
minimum_measured_weight: 450

# THE CROSS-BEAD DIMENSION, AND THE ONE FINDING SHAPE THIS PROJECT MANDATES.
#
# synthesize.py emits a "Bead-graph truthfulness flags" row for every reference
# from one bead body to a bead that is not closed. Mode A requires the opposite:
# research/SESSION-PROMPTS.md makes a close name an open downstream bead for every
# declined finding and every No-Claim gap, so the flag fires on compliance with the
# project's own discipline rather than on a defect.
#
# Measured 2026-08-27 on pass 2026-08-26T23-58-44Z: cairn-cue drew seven such rows
# and scored 0/25, while the "Done." fixture cairn-6cp drew two and scored 15/25 --
# an honest bead below a false close on the same dimension. Six of cairn-cue's seven
# rows named it as the bead somebody *else* referenced, which is not its act at all;
# score-bead.py now owns a row by its subject, the first id in the row. The seventh,
# `cairn-cue` -> `cairn-m1-cqt`, is the mandated shape and is named below.
#
# A pattern here matches the finding's raw synthesis row. It suppresses the penalty
# and nothing else: the row stays in synthesis.md, and the scorecard note says how
# many rows the policy ignored.
cross_bead_ignored_finding_patterns:
  - 'references non-closed bead'

# What a Cairn bead is: a harness slice whose product is code plus the tests that
# prove it, closed with re-executed evidence. It ships no runbook, so the default
# 100 for docs measures something this project does not produce; and Mode A
# requires a close to name an open downstream bead for every No-Claim gap, so a
# heavy integration weight penalizes the discipline the project mandates.
#
# What this cannot fix, stated so nobody reads more into it: RUBRIC.md marks a
# dimension `n/a` and REDISTRIBUTES its weight when the spec extracts no items of
# that kind. A bead whose prose the deterministic parser cannot read therefore
# scores full marks on the dimensions it was never measured against. Weights move
# the shares between dimensions; they do not close that escape. Extraction does.
weights_by_type:
  task:
    implementation: 250
    tests: 300
    anti_theater: 200
    test_depth: 200
    docs: 25
    integration: 25

  bug:
    implementation: 200
    tests: 350
    anti_theater: 200
    test_depth: 200
    docs: 25
    integration: 25

# A skipped platform is a platform nobody is testing. cairn-hcl exists because the
# M0 write boundary is macOS-only and the write-boundary test files carry
# skipif(sys.platform != "darwin"), so the degraded behavior is asserted nowhere.
# A new platform skip in evidence is a claim that a gate ran when it did not.
#
# WHAT READS THIS: scripts/theater_patterns.py, through scripts/check.sh, which
# the pre-commit hook and CI both call. The vendored skill does not: it reads the
# section only from subagents/theater-detector.md, and neither the hook path nor
# CI runs a subagent. Findings here refuse the commit; they reach no dimension of
# the audit's score.
#
# THE SIGNATURE SPANS LINES. Every platform skip in this repository puts the
# skipif arguments on the line after the call, and ripgrep is line-oriented, so
# `skipif\(sys\.platform` matched none of the four. The scanner reads whole files
# and `\s*` crosses the newline.
#
# THE EXEMPTION IS PROSPECTIVE AND SELF-REMOVING. The gap the four modules carry
# is diagnosed and owned by cairn-hcl, which is open and deferred to M1 because it
# cannot be verified on a macOS-only machine at all. Firing on them would reopen
# settled work over a gap that already has an owner, so the pattern catches the
# next unpaired skip instead: a platform skip in any other file, or a fifth module
# added to these four, is a MAJOR finding. The scanner refuses an exemption that
# names no removing bead, an exemption whose removing bead is closed, an exempt
# path no file_glob reaches, and an exempt path that no longer carries the
# signature, so the list cannot widen or outlive cairn-hcl in silence.
project_theater_patterns:
  - id: P-platform-skip-hides-a-gate
    signature: 'skipif\(\s*sys\.platform'
    file_glob: ['tests/**/*.py']
    in_test_files: true
    severity: MAJOR
    rationale: 'cairn-hcl: the write boundary degrades silently off macOS and the suite says so nowhere; a platform skip must be paired with an assertion naming the degraded behavior'
    exempt_until_bead: cairn-hcl
    exempt_paths:
      - tests/conformance/test_skill_contract.py
      - tests/integration/test_gate_bundle.py
      - tests/integration/test_grounding_fs.py
      - tests/integration/test_toy_curve_selftest.py

# Only meaningful on the parallel path; the pre-commit hook runs no subagents.
# spec-quality-reviewer is on because the measured failure is extraction, not
# scoring: Phase 2 warned "cairn-qn9 produced only 1 item(s) from a 2689-char body"
# and spec.json in fact held zero.
subagents:
  spec-quality-reviewer: pre_claim_only
  red-team-adversary: comprehensive_only
  security-auditor: false
  performance-auditor: false
  migration-safety-reviewer: false
  api-contract-checker: false
