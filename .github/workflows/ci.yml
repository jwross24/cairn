name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The gates read stdout; the JSON log lines on stderr are noise in a CI
      # transcript, and .check.log carries what actually fired.
      CAIRN_LOG: WARNING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp libpari-dev

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --locked --all-groups

      - name: Gates
        run: scripts/check.sh

      - name: The trace every gate left
        if: always()
        run: cat .check.log
