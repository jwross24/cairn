name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A macOS runner bills at ten times wall clock against a 2000-minute monthly
  # tier, so a run is a rationed resource. Superseding collapses a burst of
  # bead-closing pushes onto the tip, which contains every commit under it.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS, because that is the platform M0 supports. The write boundary is set
    # with os.chflags and stat.UF_APPEND, which exist on macOS and BSD and not on
    # Linux; cairn-hcl owns the Linux arm. An ubuntu run fails before it starts.
    runs-on: macos-latest
    # Three deadlines, innermost first: 180 s per test (pyproject.toml), then
    # CAIRN_SESSION_DEADLINE for the whole pytest session, then this ceiling for a
    # wedge outside pytest. Every successful run measured 4.4 to 8.7 minutes at 2298
    # tests, 2534 tests need past ten minutes on a slow runner, and two wedges that ran
    # to 33 and 45 cost 577 billable minutes between them, so the ceiling sits above
    # the slowest full run and far below a wedge. The Lean step below adds setup time
    # outside pytest: a ~/.elan cache restore on a hit, and on a miss a 561 MB toolchain
    # download plus a 2.7 GB unpack, measured on the build machine at 0.6 s for the
    # version probe and unmeasured on a runner until the first miss; inside pytest the
    # Lean integration test costs a lake build (8.5 s) plus a leanchecker --fresh replay
    # (50.6 s at load average 7 on the build machine).
    timeout-minutes: 20
    env:
      # Under the job ceiling by enough that pytest dies first and leaves a thread
      # profile, rather than the job being canceled with a blank transcript. The
      # local default is higher; nothing meters a local run.
      CAIRN_SESSION_DEADLINE: "1080"
      # The artifact-block gate parses `br show <id> --json`, so the runner and the
      # machines that write the beads have to agree on that shape. A bump here misses
      # the cache key below, which is what fetches the binary again.
      #
      # Matches the binary the machines that write this repo carry, so a gate reads the
      # same br in both places. beads_rust#457, where 0.5.3 malformed a migrated database
      # on a single serial write, is fixed in 0.5.6 and confirmed by two independent A/B
      # runs on 0.5.7. The release asset for the 0.5 line is named `beads_rust-`; the 0.2
      # line published `br-`.
      BR_VERSION: "0.5.7"
      # The elan release that resolves the Lean toolchain `lean/lean-toolchain` names; the
      # release publishes no checksum beside its archive, so the pin is the tag alone.
      ELAN_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The artifact-block gate resolves every commit an ARTIFACTS block names.
          # A depth-1 clone holds one commit, so every one of them reads as absent.
          fetch-depth: 0

      - name: Install PARI/GP
        run: |
          # The runner image ships aws/tap untrusted, so Homebrew warns on every
          # invocation. pari comes from homebrew/core; nothing here wants that tap.
          brew untap aws/tap || true
          brew install pari

      - name: Restore the Lean toolchain
        id: elan-cache
        # The pinned toolchain unpacks to 2.7 GB from a 561 MB release archive, so a miss
        # is a download plus an unpack. The key names everything the Lean tests resolve:
        # the elan release and the toolchain file the gate's lake project declares.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ env.ELAN_VERSION }}-${{ hashFiles('lean/lean-toolchain') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Lean toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        # No default toolchain and no PATH edit: every invocation names the toolchain with
        # `+<name>` and reaches the proxies through `$ELAN_HOME/bin`, which is the arm
        # `src/cairn/lean.py` takes, so the runner and the machines that write this repo
        # resolve the same way.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) arch=aarch64 ;;
            *) arch="$(uname -m)" ;;
          esac
          asset="elan-$arch-apple-darwin.tar.gz"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/$asset" "https://github.com/leanprover/elan/releases/download/v$ELAN_VERSION/$asset"
          tar xzf "$work/$asset" -C "$work"
          "$work/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"

      - name: The Lean toolchain the gate resolves
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/elan" --version | tee /dev/stderr | grep -F "elan $ELAN_VERSION " > /dev/null
          "$HOME/.elan/bin/lean" "+$(cat lean/lean-toolchain)" --version

      - name: Restore br
        id: br-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/br
          key: br-${{ env.BR_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install br
        if: steps.br-cache.outputs.cache-hit != 'true'
        # The published binary, checked against the sha256 published beside it.
        # `cargo install beads_rust` is the other route and it does not hold: the 0.2
        # line pulls a dependency gated behind a nightly-only feature, and the 0.5 line
        # declares a rustc floor above what a toolchain in this image is guaranteed to
        # carry. Either failure would be a red run about Rust, not about cairn.
        run: |
          set -euo pipefail
          asset="beads_rust-$BR_VERSION-darwin_$(uname -m).tar.gz"
          base="https://github.com/Dicklesworthstone/beads_rust/releases/download/v$BR_VERSION"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/$asset.sha256" "$base/$asset.sha256"
          (cd "$work" && shasum -a 256 -c "$asset.sha256")
          tar xzf "$work/$asset" -C "$work"
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$work/br" "$HOME/.cargo/bin/br"

      - name: The br the gates read
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/br" --version

      - name: The bead store the gates resolve ids against
        # `.beads/beads.db` is derived from the tracked `.beads/issues.jsonl` and is not
        # committed, so a checkout carries no store. br 0.2.22 refuses `show`, `sync` and
        # `init` alike while a `.beads` directory holding no database is in place, each
        # with the same SYNC_CONFLICT, so the tracked files are laid back down after the
        # store exists rather than before. The `br show` at the end is what makes a
        # rebuild that half-worked fail here rather than in a later step.
        run: |
          set -euo pipefail
          mv .beads "$RUNNER_TEMP/beads-tracked"
          br init
          cp "$RUNNER_TEMP/beads-tracked/.gitignore" .beads/.gitignore
          cp "$RUNNER_TEMP/beads-tracked/config.yaml" .beads/config.yaml
          cp "$RUNNER_TEMP/beads-tracked/metadata.json" .beads/metadata.json
          cp "$RUNNER_TEMP/beads-tracked/issues.jsonl" .beads/issues.jsonl
          br sync --import-only
          br show cairn-exi --json > /dev/null

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # uv.lock pins the dependencies; this pins the resolver that reads it.
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --locked --all-groups

      - name: Gates
        run: scripts/check.sh

      - name: The trace every gate left
        if: always()
        run: cat .check.log

      - name: The artifacts a red run leaves behind
        # A run killed by the job ceiling is cancelled, not failed, and it is the
        # run whose artifacts are hardest to get any other way.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cairn-failure-diagnostics
          path: |
            .check.log
            .doctor/runs/**
            beads_compliance_audit/passes/**
          if-no-files-found: ignore
          retention-days: 7
