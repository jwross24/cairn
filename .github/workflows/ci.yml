name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS, because that is the platform M0 supports. The write boundary is set
    # with os.chflags and stat.UF_APPEND, which exist on macOS and BSD and not on
    # Linux; cairn-hcl owns the Linux arm. An ubuntu run fails before it starts.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PARI/GP
        run: brew install pari

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --locked --all-groups

      - name: Gates
        run: scripts/check.sh

      - name: The trace every gate left
        if: always()
        run: cat .check.log
