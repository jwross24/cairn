name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Standard hosted runner minutes are free for this public repo; canceling superseded
  # runs frees concurrent runner slots. https://docs.github.com/en/billing/concepts/product-billing/github-actions
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    name: check (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [container, container-replay-exact, container-replay-refusals, container-plan-exact, container-plan-proven, container-plan-refusals]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 41
    env:
      CAIRN_SESSION_DEADLINE: "1080"
      BR_VERSION: "0.7.6"
      PYTEST_ADDOPTS: "-vv"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Linux Python build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp libpari-dev libgmp-dev libmpfr-dev build-essential
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync Linux locked environment
        run: uv sync --locked --all-groups
      - name: Identify Linux prerequisite cache
        id: linux-prerequisite-key
        env:
          CAIRN_CACHE_RUNNER_OS: ${{ runner.os }}
          CAIRN_CACHE_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          inputs = (
              "bundle/Containerfile",
              "bundle/container.json",
              "bundle/lean.json",
              "lean/lake-manifest.json",
              "lean/lean-toolchain",
              "tests/_linux_dependencies.py",
              "src/cairn/container.py",
              "src/cairn/lean.py",
              "src/cairn/solutionbuild.py",
          )
          inputs_hash = hashlib.sha256()
          for name in inputs:
              inputs_hash.update(name.encode("utf-8"))
              inputs_hash.update(b"\0")
              inputs_hash.update(Path(name).read_bytes())
              inputs_hash.update(b"\0")

          info = json.loads(
              subprocess.run(
                  ["docker", "info", "--format", "{{json .}}"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              ).stdout
          )
          backend = json.dumps(
              {
                  "server_version": info["ServerVersion"],
                  "driver": info["Driver"],
                  "driver_status": info["DriverStatus"],
              },
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          docker_hash = hashlib.sha256(backend).hexdigest()
          identity_hash = inputs_hash.hexdigest()
          key = (
              f"cairn-linux-prerequisites-v1-{os.environ['CAIRN_CACHE_RUNNER_OS']}-"
              f"{os.environ['CAIRN_CACHE_RUNNER_ARCH']}-{docker_hash}-{identity_hash}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"docker-fingerprint={docker_hash}\n")
              output.write(f"inputs-fingerprint={identity_hash}\n")
              output.write(f"key={key}\n")
          PY
      - name: Restore Linux prerequisite cache
        id: linux-prerequisite-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/cairn-linux-prerequisites/dependencies
            ${{ runner.temp }}/cairn-linux-prerequisites/image.tar
            ${{ runner.temp }}/cairn-linux-prerequisites/image.tar.metadata.json
          key: ${{ steps.linux-prerequisite-key.outputs.key }}
      - name: Import cached Linux prerequisites
        if: steps.linux-prerequisite-cache.outputs.cache-hit == 'true'
        run: uv run python tests/_linux_dependencies.py --cache "$RUNNER_TEMP/cairn-linux-prerequisites/dependencies" --import-archive "$RUNNER_TEMP/cairn-linux-prerequisites/image.tar"
      - name: Prepare Linux prerequisites
        if: steps.linux-prerequisite-cache.outputs.cache-hit != 'true'
        run: uv run python tests/_linux_dependencies.py --cache "$RUNNER_TEMP/cairn-linux-prerequisites/dependencies"
      - name: Install Linux br
        run: |
          set -euo pipefail
          asset="br-$BR_VERSION-linux_arm64.tar.gz"
          base="https://github.com/Dicklesworthstone/beads_rust/releases/download/v$BR_VERSION"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/$asset.sha256" "$base/$asset.sha256"
          (cd "$work" && sha256sum -c "$asset.sha256")
          tar xzf "$work/$asset" -C "$work"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$work/br" "$HOME/.local/bin/br"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import Linux bead store
        run: |
          set -euo pipefail
          mv .beads "$RUNNER_TEMP/beads-tracked"
          br init
          cp "$RUNNER_TEMP/beads-tracked/.gitignore" .beads/.gitignore
          cp "$RUNNER_TEMP/beads-tracked/config.yaml" .beads/config.yaml
          cp "$RUNNER_TEMP/beads-tracked/metadata.json" .beads/metadata.json
          cp "$RUNNER_TEMP/beads-tracked/issues.jsonl" .beads/issues.jsonl
          br sync --import-only
          br show cairn-exi --json
      - name: Linux container gates
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
          CAIRN_LINUX_DEPENDENCY_CACHE: ${{ runner.temp }}/cairn-linux-prerequisites/dependencies
        run: scripts/check.sh --ci-lane "${{ matrix.lane }}"
      - name: Linux adapter types
        run: uv run ty check --python-platform linux src/cairn/container.py src/cairn/lean.py src/cairn/solutionbuild.py src/cairn/solutionchecks.py tests/_linux_dependencies.py tests/integration/test_container_statement_hash.py tests/integration/test_lean_container.py
      - name: Export Linux prerequisites
        if: success() && matrix.lane == 'container' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-prerequisite-cache.outputs.cache-hit != 'true'
        run: uv run python tests/_linux_dependencies.py --cache "$RUNNER_TEMP/cairn-linux-prerequisites/dependencies" --export-archive "$RUNNER_TEMP/cairn-linux-prerequisites/image.tar"
      - name: Save Linux prerequisite cache
        if: success() && matrix.lane == 'container' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/cairn-linux-prerequisites/dependencies
            ${{ runner.temp }}/cairn-linux-prerequisites/image.tar
            ${{ runner.temp }}/cairn-linux-prerequisites/image.tar.metadata.json
          key: ${{ steps.linux-prerequisite-key.outputs.key }}
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cairn-failure-diagnostics-${{ matrix.lane }}
          path: |
            .check.log
            ${{ runner.temp }}/pytest-of-*/pytest-[0-9]*/*[0-9]/test.log.jsonl
            ${{ runner.temp }}/pytest-of-*/pytest-[0-9]*/basetemp/*[0-9]/test.log.jsonl
            ${{ runner.temp }}/pytest-of-*/cairn-test-logs/pytest-[0-9]*/*/test.log.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  check:
    name: check (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [python, python-integration, m0-lineage, m0-replay, m0-transcript, m0-boundaries, gateplan, lean-core, lean-replay, solution, solution-library-dlp, solution-library-finite-point, solution-library-binding, solution-plan-exact, solution-plan-refusals]
    # macOS, because that is the platform M0 supports. The write boundary is set
    # with os.chflags and stat.UF_APPEND, which exist on macOS and BSD and not on
    # Linux; cairn-hcl owns the Linux arm. An ubuntu run fails before it starts.
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.lane == 'solution-plan-exact' && 45 || 20 }}
    env:
      PYTEST_ADDOPTS: "-vv"
      # cypari2 2.2.4 does not build on the CPython 3.15 that macos-latest resolves.
      UV_PYTHON: "3.14"
      # Under the job ceiling by enough that pytest dies first and leaves a thread
      # profile, rather than the job being canceled with a blank transcript. The
      # local default is higher; nothing meters a local run.
      CAIRN_SESSION_DEADLINE: ${{ matrix.lane == 'solution-plan-exact' && '1962' || '1080' }}
      # The artifact-block gate parses `br show <id> --json`, so this matches the br the
      # machines that write the beads carry; it is the install-br cache key. The 0.6 and 0.7
      # lines name the asset `br-` with `arm64`; the 0.5 line used `beads_rust-` with `aarch64`.
      BR_VERSION: "0.7.6"
      # The elan release that resolves the Lean toolchain `lean/lean-toolchain` names; the
      # release publishes no checksum beside its archive, so the pin is the tag alone.
      ELAN_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The artifact-block gate resolves every commit an ARTIFACTS block names.
          # A depth-1 clone holds one commit, so every one of them reads as absent.
          fetch-depth: 0

      - name: Install PARI/GP
        uses: ./.github/actions/install-pari

      - name: Restore the Lean toolchain
        id: elan-cache
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        # The pinned toolchain unpacks to 2.7 GB from a 561 MB release archive, so a miss
        # is a download plus an unpack. The key names everything the Lean tests resolve:
        # the elan release and the toolchain file the gate's lake project declares.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ env.ELAN_VERSION }}-${{ hashFiles('lean/lean-toolchain') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Lean toolchain
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan' && steps.elan-cache.outputs.cache-hit != 'true'
        # No default toolchain and no PATH edit: every invocation names the toolchain with
        # `+<name>` and reaches the proxies through `$ELAN_HOME/bin`, which is the arm
        # `src/cairn/lean.py` takes, so the runner and the machines that write this repo
        # resolve the same way.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) arch=aarch64 ;;
            *) arch="$(uname -m)" ;;
          esac
          asset="elan-$arch-apple-darwin.tar.gz"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/$asset" "https://github.com/leanprover/elan/releases/download/v$ELAN_VERSION/$asset"
          tar xzf "$work/$asset" -C "$work"
          "$work/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"

      - name: The Lean toolchain the gate resolves
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/elan" --version | tee /dev/stderr | grep -F "elan $ELAN_VERSION " > /dev/null
          "$HOME/.elan/bin/lean" "+$(cat lean/lean-toolchain)" --version

      - name: Restore the pinned mathlib cache
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            lean/.lake
            ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}

      - name: Provision the pinned mathlib prerequisite
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        working-directory: lean
        run: |
          set -euo pipefail
          toolchain="$(cat lean-toolchain)"
          "$HOME/.elan/bin/lake" "+$toolchain" exe cache get Mathlib.AlgebraicGeometry.EllipticCurve.Affine.Point
          git diff --exit-code -- lake-manifest.json

      - name: Install br
        uses: ./.github/actions/install-br
        with:
          version: ${{ env.BR_VERSION }}

      - name: The br the gates read
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/br" --version

      - name: The bead store the gates resolve ids against
        # `.beads/beads.db` is derived from the tracked `.beads/issues.jsonl` and is not
        # committed, so a checkout carries no store. br 0.2.22 refuses `show`, `sync` and
        # `init` alike while a `.beads` directory holding no database is in place, each
        # with the same SYNC_CONFLICT, so the tracked files are laid back down after the
        # store exists rather than before. The `br show` at the end is what makes a
        # rebuild that half-worked fail here rather than in a later step.
        run: |
          set -euo pipefail
          mv .beads "$RUNNER_TEMP/beads-tracked"
          br init
          cp "$RUNNER_TEMP/beads-tracked/.gitignore" .beads/.gitignore
          cp "$RUNNER_TEMP/beads-tracked/config.yaml" .beads/config.yaml
          cp "$RUNNER_TEMP/beads-tracked/metadata.json" .beads/metadata.json
          cp "$RUNNER_TEMP/beads-tracked/issues.jsonl" .beads/issues.jsonl
          br sync --import-only
          br show cairn-exi --json > /dev/null

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # uv.lock pins the dependencies; this pins the resolver that reads it.
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # A cached cypari2 wheel is linked to the libpari it was built against.
          cache-suffix: pari-2.17.4

      - name: Sync the locked environment
        run: uv sync --locked --all-groups

      - name: Read comparator pins
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        id: comparator-pins
        run: |
          uv run python -c 'import json; from pathlib import Path; p=json.loads(Path("bundle/container.json").read_text())["comparator"]; print("repository=" + p["repo"].removeprefix("https://github.com/")); print("revision=" + p["rev"]); print("exporter=" + p["lean4export_rev"])' >> "$GITHUB_OUTPUT"

      - name: Provision comparator source
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.comparator-pins.outputs.repository }}
          ref: ${{ steps.comparator-pins.outputs.revision }}
          path: .doctor/comparator
          persist-credentials: false
          clean: false

      - name: Provision exporter source
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean4export
          ref: ${{ steps.comparator-pins.outputs.exporter }}
          path: .doctor/comparator/.lake/packages/lean4export
          persist-credentials: false
          clean: false

      - name: Restore the pinned comparator build
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        id: comparator-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .doctor/comparator/.lake/build
            .doctor/comparator/.lake/packages/lean4export/.lake/build
          key: comparator-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.comparator-pins.outputs.revision }}-${{ steps.comparator-pins.outputs.exporter }}-${{ hashFiles('lean/lean-toolchain', '.doctor/comparator/lean-toolchain') }}

      - name: Build pinned comparator and exporter
        if: matrix.lane != 'python' && matrix.lane != 'python-integration' && matrix.lane != 'm0-lineage' && matrix.lane != 'm0-replay' && matrix.lane != 'm0-transcript' && matrix.lane != 'm0-boundaries' && matrix.lane != 'gateplan'
        working-directory: .doctor/comparator
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" "+$(cat lean-toolchain)" build lean4export comparator

      - name: Gates
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: scripts/check.sh --ci-lane "${{ matrix.lane }}"

      - name: The trace every gate left
        if: always()
        run: cat .check.log

      - name: The artifacts a red run leaves behind
        # A run killed by the job ceiling is canceled, not failed, and it is the
        # run whose artifacts are hardest to get any other way.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cairn-failure-diagnostics-${{ matrix.lane }}
          path: |
            .check.log
            .doctor/runs/**
            beads_compliance_audit/passes/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cairn-test-diagnostics-${{ matrix.lane }}
          path: |
            .check.log
            ${{ runner.temp }}/pytest-of-*/pytest-[0-9]*/*[0-9]/test.log.jsonl
            ${{ runner.temp }}/pytest-of-*/pytest-[0-9]*/basetemp/*[0-9]/test.log.jsonl
            ${{ runner.temp }}/pytest-of-*/cairn-test-logs/pytest-[0-9]*/*/test.log.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
