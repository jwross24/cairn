[project]
name = "cairn"
version = "0.0.1"
description = "Cairn: a research harness with immutable epistemics and mutable strategy"
requires-python = ">=3.14"
dependencies = [
    "blake3>=1.0.9",
    "cypari2>=2.2.4",
]

[project.scripts]
cairn = "cairn.cli:entry"

[build-system]
requires = ["uv_build>=0.8.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
