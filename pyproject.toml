[project]
name = "cairn"
version = "0.0.1"
description = "Cairn: a research harness with immutable epistemics and mutable strategy"
requires-python = ">=3.14"
dependencies = [
    "blake3>=1.0.9",
    "cypari2>=2.2.4",
]

[project.scripts]
cairn = "cairn.cli:entry"

[build-system]
requires = ["uv_build>=0.8.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "codespell==2.4.3",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-timeout==2.4.0",
    "pyyaml>=6.0.3",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:faulthandler"
timeout = 180
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I", "UP", "B", "C4", "PIE", "SIM", "RUF", "PERF", "RET", "FURB",
    "DTZ", "LOG", "G", "PT", "ARG", "N", "S", "EXE", "ISC003", "PTH",
]
ignore = [
    "S101",
    "S105",
    "S603",
    "S608",
    "SIM115",
    "ARG005",
    "N802", "N803", "N806", "N818",
    "PT017",
    "PT018",
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S311", "S607"]
# git, br and uv are resolved from PATH by design; an absolute path would pin one install.
"scripts/**" = ["S607"]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
ignore-words-list = "aci,fro"
ignore-regex = "`[^`]*`"
skip = "./.git,./.venv,./.beads,./uv.lock,./tests/goldens,./tests/vectors,./beads_compliance_audit,./bundle,./research/convergence,./deploy,./var,./lean/.lake"

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["scripts"]
